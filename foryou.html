<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celline ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family: Arial, sans-serif;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .name {
            position: fixed;
            left: 50%;
            top: 73%;
            transform: translate(-50%, -50%);

            color: #4da3ff;
            font-size: clamp(40px, 7vw, 85px);
            font-weight: 600;
            letter-spacing: 5px;

            text-shadow:
                0 0 5px #168cff,
                0 0 15px #168cff,
                0 0 35px #006eff,
                0 0 65px #006eff;

            opacity: 0;
            animation: nameAppear 2s ease forwards;
            animation-delay: 3.5s;

            user-select: none;
            pointer-events: none;
        }

        @keyframes nameAppear {
            from {
                opacity: 0;
                transform: translate(-50%, -40%) scale(0.8);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
    </style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="name">celline</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let particles = [];
let width;
let height;

const PARTICLE_COUNT = 650;

let startTime = performance.now();


// ===============================
// CANVAS
// ===============================

function resize() {
    width = canvas.width = window.innerWidth * devicePixelRatio;
    height = canvas.height = window.innerHeight * devicePixelRatio;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    width = window.innerWidth;
    height = window.innerHeight;
}

window.addEventListener("resize", resize);

resize();


// ===============================
// RANDOM
// ===============================

function random(min, max) {
    return Math.random() * (max - min) + min;
}


// ===============================
// HEART EQUATION
// ===============================

function heart(t, scale) {

    const x =
        16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: x * scale,
        y: -y * scale
    };
}


// ===============================
// PARTICLE
// ===============================

class Particle {

    constructor() {

        this.reset();

        this.size = random(2.2, 5.5);

        this.alpha = random(0.6, 1);

        this.phaseDelay = random(0, 0.8);

        this.angle = random(0, Math.PI * 2);

        this.speed = random(3, 9);

        this.target = {
            x: 0,
            y: 0
        };
    }


    reset() {

        // Semua partikel dimulai dari bawah

        this.x = width / 2 + random(-100, 100);

        this.y = height + random(20, 300);

        this.vx = random(-1.5, 1.5);

        this.vy = random(-10, -5);

        this.explosionX = 0;

        this.explosionY = 0;
    }


    update(time) {

        const t = time - this.phaseDelay;


        // ===================================
        // FASE 1
        // PARTIKEL NAIK DARI BAWAH
        // ===================================

        if (t < 1.2) {

            this.x += this.vx;

            this.y += this.vy;

            this.vy += 0.08;

        }


        // ===================================
        // FASE 2
        // LEDAKAN
        // ===================================

        else if (t < 2.1) {

            if (!this.exploded) {

                this.exploded = true;

                this.explosionX =
                    random(-350, 350);

                this.explosionY =
                    random(-280, 150);

                this.vx =
                    this.explosionX / 25;

                this.vy =
                    this.explosionY / 25;
            }

            this.x += this.vx;

            this.y += this.vy;

            this.vx *= 0.94;
            this.vy *= 0.94;
        }


        // ===================================
        // FASE 3
        // BERKUMPUL MEMBENTUK HATI
        // ===================================

        else {

            const progress =
                Math.min(
                    1,
                    (t - 2.1) / 1.6
                );

            const targetX =
                width / 2 + this.target.x;

            const targetY =
                height / 2 + this.target.y;

            // ease out

            const ease =
                1 - Math.pow(1 - progress, 3);

            this.x +=
                (targetX - this.x) * 0.035 * ease;

            this.y +=
                (targetY - this.y) * 0.035 * ease;

            // sedikit gerakan hidup

            this.x += Math.sin(time * 3 + this.angle) * 0.25;

            this.y += Math.cos(time * 2 + this.angle) * 0.25;
        }
    }


    draw() {

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        // glow

        ctx.shadowBlur = this.size * 5;

        ctx.shadowColor = "#0077ff";

        ctx.fillStyle =
            `rgba(30, 130, 255, ${this.alpha})`;

        ctx.fill();

        ctx.shadowBlur = 0;
    }
}


// ===============================
// CREATE PARTICLES
// ===============================

function createParticles() {

    particles = [];

    for (let i = 0; i < PARTICLE_COUNT; i++) {

        const p = new Particle();

        // posisi hati

        const angle =
            (i / PARTICLE_COUNT) *
            Math.PI * 2 *
            7;

        const radius =
            Math.pow(Math.random(), 0.55);

        const h =
            heart(angle, 17);

        p.target.x =
            h.x * radius +
            random(-4, 4);

        p.target.y =
            h.y * radius +
            random(-4, 4);

        // supaya bagian hati lebih penuh

        p.target.x *=
            Math.min(1.15, 0.9 + Math.random() * 0.3);

        p.target.y *=
            Math.min(1.15, 0.9 + Math.random() * 0.3);

        particles.push(p);
    }
}

createParticles();


// ===============================
// EXTRA FLOATING PARTICLES
// ===============================

const floatingParticles = [];

for (let i = 0; i < 100; i++) {

    floatingParticles.push({

        x: random(0, window.innerWidth),

        y: random(0, window.innerHeight),

        size: random(1, 3),

        speed: random(0.1, 0.5),

        alpha: random(0.2, 0.8)
    });
}


// ===============================
// DRAW BACKGROUND PARTICLES
// ===============================

function drawFloatingParticles() {

    floatingParticles.forEach(p => {

        p.y -= p.speed;

        if (p.y < 0) {
            p.y = height;
        }

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(20,120,255,${p.alpha})`;

        ctx.shadowBlur = 10;

        ctx.shadowColor = "#0077ff";

        ctx.fill();

        ctx.shadowBlur = 0;
    });
}


// ===============================
// ANIMATION
// ===============================

function animate(now) {

    const elapsed =
        (now - startTime) / 1000;

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    drawFloatingParticles();


    particles.forEach(p => {

        p.update(elapsed);

        p.draw();

    });


    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);


// ===============================
// RESTART ANIMATION
// ===============================

setInterval(() => {

    startTime = performance.now();

    particles.forEach(p => {

        p.exploded = false;

        p.reset();

    });

}, 8500);

</script>

</body>
</html>
